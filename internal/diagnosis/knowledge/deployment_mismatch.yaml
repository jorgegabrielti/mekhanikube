key: "deployment-mismatch"
title: "Deployment Replicas Mismatch"
explanation: |
  The number of ready or available replicas does not match the desired count specified in the Deployment.
  If a rollout is ongoing, this could be transient. If stuck, new pods are likely failing to become ready (CrashLoop, Pending, ImagePullBackOff).
  List the pods for this Deployment to check their individual statuses.
commands:
  - "kubectl get pods -n {namespace} -l $(kubectl get deployment {name} -n {namespace} -o jsonpath='{.spec.selector.matchLabels}' | jq -r 'to_entries | map(\"\\(.key)=\\(.value)\") | join(\",\")')"
  - "kubectl rollout status deployment/{name} -n {namespace}"
  - "kubectl describe deployment {name} -n {namespace} | grep -A 10 'Conditions:'"
windows_commands:
  - "kubectl get pods -n {namespace} -l $((kubectl get deployment {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels | Get-Member -MemberType NoteProperty | ForEach-Object { \"$($_.Name)=$((kubectl get deployment {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels.$($_.Name))\" } | join ',')"
  - "kubectl rollout status deployment/{name} -n {namespace}"
  - "kubectl describe deployment {name} -n {namespace} | Select-String -Pattern 'Conditions:' -Context 0,10"
