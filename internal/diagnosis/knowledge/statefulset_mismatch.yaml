key: statefulset_mismatch
title: StatefulSet replicas mismatch
explanation: |
  The StatefulSet has a mismatch between desired and ready replicas. This often occurs when PersistentVolumeClaims cannot be bound, pod initialization is failing, or there are issues with the Headless Service required for StatefulSet networking.
commands:
  - "kubectl describe sts {name} -n {namespace}"
  - "kubectl get pods -l $(kubectl get sts {name} -n {namespace} -o jsonpath='{.spec.selector.matchLabels}' | jq -r 'to_entries | .[] | \"\\(.key)=\\(.value)\"') -n {namespace} # List STS pods"
  - "kubectl get pvc -l $(kubectl get sts {name} -n {namespace} -o jsonpath='{.spec.selector.matchLabels}' | jq -r 'to_entries | .[] | \"\\(.key)=\\(.value)\"') -n {namespace} # Check STS PVCs"
windows_commands:
  - "kubectl describe sts {name} -n {namespace}"
  - "kubectl get pods -l $((kubectl get sts {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels | Get-Member -MemberType NoteProperty | ForEach-Object { \"$($_.Name)=$((kubectl get sts {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels.$($_.Name))\" } | join ',') -n {namespace}"
  - "kubectl get pvc -l $((kubectl get sts {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels | Get-Member -MemberType NoteProperty | ForEach-Object { \"$($_.Name)=$((kubectl get sts {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels.$($_.Name))\" } | join ',') -n {namespace}"
