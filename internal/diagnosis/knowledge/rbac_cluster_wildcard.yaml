key: rbac_cluster_wildcard
title: ClusterRole has wildcard permissions
explanation: |
  The ClusterRole grants cluster-wide permissions using the '*' wildcard for verbs, resources, or
  apiGroups. Any subject (user, group, ServiceAccount) bound to this role gets unrestricted access
  to that resource type across ALL namespaces, violating the principle of least privilege.

  Note: Built-in system ClusterRoles (cluster-admin, admin, edit, view) are intentionally broad.
  If this is a system role, verify it is bound ONLY to trusted, necessary subjects.

  Steps:
    1. Inspect the ClusterRole YAML to identify which rules contain wildcards.
    2. Find all ClusterRoleBindings that reference this role — these are all affected subjects.
    3. For each wildcard rule, replace '*' with only the specific verbs and resources required.
    4. Use kubectl auth can-i to verify the restricted role has the right permissions.
commands:
  - "kubectl get clusterrole {name} -o yaml"
  - "kubectl get clusterrolebindings -o wide | grep {name}"
  - "# Fix: kubectl edit clusterrole {name}  -- replace wildcard verbs/resources with explicit ones"
  - "kubectl auth can-i --list --as=system:serviceaccount:{namespace}:{name}"
windows_commands:
  - "kubectl get clusterrole {name} -o yaml"
  - "kubectl get clusterrolebindings -o wide | Select-String '{name}'"
  - "# Fix: kubectl edit clusterrole {name}  -- replace wildcard verbs/resources with explicit ones"
  - "kubectl auth can-i --list --as=system:serviceaccount:{namespace}:{name}"
