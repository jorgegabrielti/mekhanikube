key: "node-memory-pressure"
title: "Node Under Memory Pressure"
explanation: |
  The Node is running dangerously low on available memory and has transitioned to a 'MemoryPressure' state.
  To protect itself, the kubelet will vigorously start evicting pods without proper requests/limits to reclaim memory.
  Identify which pods are consuming the most memory on this specific node and ensure they have appropriate limits set.
commands:
  - "kubectl top node {name}"
  - "kubectl top pods -A --sort-by=memory | head -n 15"
  - "kubectl describe node {name} | grep -A 5 'Allocated resources'"
