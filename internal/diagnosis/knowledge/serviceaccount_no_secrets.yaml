key: serviceaccount_no_secrets
title: ServiceAccount has no secrets
explanation: |
  The ServiceAccount does not have any Secrets or ImagePullSecrets associated with it. This might prevent pods from pulling images from private registries or authenticating with APIs that require specific credentials.
commands:
  - "kubectl describe sa {name} -n {namespace}"
  - "kubectl get sa {name} -n {namespace} -o yaml"
