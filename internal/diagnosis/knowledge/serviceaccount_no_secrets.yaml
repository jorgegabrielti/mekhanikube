key: serviceaccount_no_secrets
title: ServiceAccount has no secrets or imagePullSecrets
explanation: |
  The ServiceAccount has no Secrets or ImagePullSecrets associated with it.

  IMPORTANT CONTEXT: Since Kubernetes v1.24, ServiceAccounts no longer automatically create
  long-lived token Secrets — this is intentional and a security improvement. For system
  ServiceAccounts in kube-system (controllers, scheduler, etc.), this finding is EXPECTED
  and benign; no action is needed.

  Only act if ALL of these are true:
    - The ServiceAccount is used by pods in a user-managed namespace.
    - Those pods need to pull images from a PRIVATE container registry.
    - The pods are actually failing with ImagePullBackOff errors.

  Fix (only if needed):
    1. Create an imagePullSecret with your registry credentials.
    2. Patch the ServiceAccount to reference that secret.
    3. Verify pods can now pull images successfully.
commands:
  - "kubectl get sa {name} -n {namespace} -o yaml"
  - "kubectl get pods -n {namespace} -o wide | grep {name}"
  - "# Only if pods need private registry: kubectl create secret docker-registry <secret-name> --docker-server=<registry> --docker-username=<user> --docker-password=<pass> -n {namespace}"
  - "# Then patch: kubectl patch sa {name} -n {namespace} -p '{\"imagePullSecrets\":[{\"name\":\"<secret-name>\"}]}'"
windows_commands:
  - "kubectl get sa {name} -n {namespace} -o yaml"
  - "kubectl get pods -n {namespace} -o wide | Select-String '{name}'"
  - "# Only if pods need private registry: kubectl create secret docker-registry <secret-name> --docker-server=<registry> --docker-username=<user> --docker-password=<pass> -n {namespace}"
  - "# Then patch: kubectl patch sa {name} -n {namespace} -p '{\"imagePullSecrets\":[{\"name\":\"<secret-name>\"}]}'"
