key: "service-lb-pending"
title: "LoadBalancer Pending External IP"
explanation: |
  This Service of type LoadBalancer has not received an External IP from the provider infrastructure.
  On cloud providers (AWS, GCP, Azure), this usually indicates a quota limit, lack of permissions by the Cloud Controller Manager, or an invalid annotation. 
  On local bare-metal clusters (like Minikube or Kind), LoadBalancer services stay "Pending" forever unless a tool like MetalLB is installed and configured.
commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name} --sort-by='.lastTimestamp'"
  - "kubectl describe service {name} -n {namespace} | grep -i 'Annotations'"
