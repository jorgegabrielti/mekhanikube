key: "crashloopbackoff"
title: "Container in CrashLoopBackOff"
explanation: |
  The container is crashing repeatedly and Kubernetes keeps restarting it
  with exponential backoff. Common causes: application error, misconfigured
  command/entrypoint, or missing configuration (env vars, config files).
commands:
  - "kubectl logs {pod} -n {namespace} --previous"
  - "kubectl describe pod {pod} -n {namespace}"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod}"
