key: "oomkilled"
title: "Container OOMKilled"
explanation: |
  The container process exceeded its configured memory limit (`limits.memory`) and was forcefully terminated by the Linux kernel. Check the 'Last State' in the pod description to confirm the OOMKilled reason. Compare the pod's current memory usage with its limits.
commands:
  - "kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"
  - "kubectl describe pod {pod} -n {namespace} | grep -A5 -B2 'OOMKilled'"
  - "kubectl top pod {pod} -n {namespace}"
windows_commands:
  - "kubectl get pod {pod} -n {namespace} -o jsonpath='{.spec.containers[*].resources}'"
  - "kubectl describe pod {pod} -n {namespace} | Select-String -Pattern 'OOMKilled' -Context 2,5"
  - "kubectl top pod {pod} -n {namespace}"
