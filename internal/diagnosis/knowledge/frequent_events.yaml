key: "frequent-events"
title: "Frequent Warning Events"
explanation: |
  This resource has generated many Warning events in a short period. This indicates a recurring issue that Kubernetes' control loop is repeatedly attempting to handle (e.g., Liveness Probe failing, Pod Sandbox changes, Network plugin errors).
  Use the field-selector to isolate and read these specific events.
commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name},type=Warning --sort-by='.lastTimestamp'"
  - "kubectl describe {kind} {name} -n {namespace} | tail -n 20"
