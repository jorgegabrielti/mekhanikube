key: "frequent-events"
title: "Frequent Warning Events"
explanation: |
  This resource is repeatedly generating Warning events. Each event type has a different fix:

    - BackOff / CrashLoopBackOff:  Container is crashing. Shell into the pod or check --previous logs.
    - FailedMount:                  A Secret, ConfigMap, or PVC does not exist or is not ready.
    - FailedScheduling:             No node has enough CPU/memory. Check node capacity or add resources.
    - Liveness/Readiness ProbeErr:  Probe target is wrong, the endpoint is too slow, or thresholds are too tight.
    - ErrImagePull / ImagePullBackOff: Image tag not found or registry credentials are missing/expired.
    - Evicted:                      Node is under memory or disk pressure. Check node conditions.
    - NetworkPlugin errors:         CNI plugin issue — check DaemonSet pods (e.g., kindnet, calico-node).

  Steps:
    1. List Warning events for this resource and note the recurring Reason and Message.
    2. Match the Reason to the category above and act accordingly.
    3. After fixing, verify the events stop repeating.
commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name},type=Warning --sort-by='.lastTimestamp'"
  - "kubectl describe {kind} {name} -n {namespace}"
  - "kubectl get events -n {namespace} --sort-by='.lastTimestamp' | tail -30"
windows_commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name},type=Warning --sort-by='.lastTimestamp'"
  - "kubectl describe {kind} {name} -n {namespace}"
  - "kubectl get events -n {namespace} --sort-by='.lastTimestamp' | Select-Object -Last 30"
