key: secret_empty
title: Secret contains no data
explanation: |
  The Secret has an empty data payload. While valid, it often indicates a misconfiguration in the deployment pipeline or a failure in an external secret management sync (like vault-k8s or external-secrets).
commands:
  - "kubectl describe secret {name} -n {namespace}"
  - "kubectl get secret {name} -n {namespace} -o yaml"
