key: "event-hpa-misconfigured"
title: "HPA Target Misconfigured"
explanation: |
  The HorizontalPodAutoscaler cannot find or scale its target resource. Common causes:

    - FailedGetScale: The target Deployment/StatefulSet does not exist or was deleted.
    - SelectorRequired: The HPA spec is missing a required label selector.
    - The HPA references a different apiVersion than the actual resource.

  Steps:
    1. Check the HPA target reference matches an existing resource.
    2. Verify the Deployment/StatefulSet exists and is not being deleted.
    3. Ensure the HPA spec.scaleTargetRef is correct (name, apiVersion, kind).
commands:
  - "kubectl get hpa {name} -n {namespace} -o yaml"
  - "kubectl get hpa {name} -n {namespace} -o jsonpath='{.spec.scaleTargetRef}'"
  - "kubectl get deploy,sts -n {namespace} | grep {name}"
  - "kubectl describe hpa {name} -n {namespace}"
windows_commands:
  - "kubectl get hpa {name} -n {namespace} -o yaml"
  - "kubectl describe hpa {name} -n {namespace}"
