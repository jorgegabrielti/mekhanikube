key: "event-failed-mount"
title: "Volume Mount Failure"
explanation: |
  A volume could not be mounted to the container. Common causes:

    - The referenced Secret, ConfigMap, or PVC does not exist.
    - The PVC is in Pending state (no PV available or StorageClass misconfigured).
    - NFS/EBS/EFS mount target is unreachable from the node.
    - The volume is already exclusively mounted by another pod (ReadWriteOnce).

  Steps:
    1. Read the event message to identify which volume failed.
    2. Verify the Secret/ConfigMap/PVC referenced in the pod spec exists.
    3. For PVC issues, check PVC status and StorageClass provisioner.
commands:
  - "kubectl describe {kind} {name} -n {namespace} | grep -A5 'Volumes\\|Events'"
  - "kubectl get pvc -n {namespace}"
  - "kubectl get secret -n {namespace} -o name"
  - "kubectl get configmap -n {namespace} -o name"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name} --sort-by='.lastTimestamp'"
windows_commands:
  - "kubectl describe {kind} {name} -n {namespace}"
  - "kubectl get pvc -n {namespace}"
  - "kubectl get secret -n {namespace} -o name"
