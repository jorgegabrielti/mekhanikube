key: "event-secret-sync-failed"
title: "ExternalSecret Sync Failure"
explanation: |
  The ExternalSecret operator failed to sync a secret from the external provider
  (e.g., HashiCorp Vault, AWS Secrets Manager). Common causes:

    - The secret path does not exist in the external provider.
    - The SecretStore/ClusterSecretStore credentials are expired or misconfigured.
    - The external provider (Vault, AWS SM) is unreachable from the cluster.
    - IAM role or policy attached to the SecretStore lacks permissions.

  Steps:
    1. Check the ExternalSecret status for the specific error message.
    2. Verify the SecretStore is healthy and can connect to the provider.
    3. Confirm the secret path exists in the external provider.
    4. Check IAM/RBAC permissions for the service account used by the operator.
commands:
  - "kubectl get externalsecret {name} -n {namespace} -o yaml"
  - "kubectl get secretstore -n {namespace} -o wide"
  - "kubectl get clustersecretstore -o wide"
  - "kubectl logs -l app.kubernetes.io/name=external-secrets -n external-secrets --tail=50"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name} --sort-by='.lastTimestamp'"
windows_commands:
  - "kubectl get externalsecret {name} -n {namespace} -o yaml"
  - "kubectl get secretstore -n {namespace} -o wide"
  - "kubectl get clustersecretstore -o wide"
