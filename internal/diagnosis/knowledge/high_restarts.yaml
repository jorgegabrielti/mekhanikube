key: "high-restarts"
title: "High Container Restart Count"
explanation: |
  A container in this pod has restarted an abnormally high number of times. Common root causes:

    - Exit 137 (OOMKilled):  Container exceeded its memory limit. Increase resources.limits.memory.
    - Exit 1/2 (App crash):  Application panic, bad config, missing env var, or failed health check.
    - Exit 0 (Unexpected):   Process exited cleanly but unexpectedly — wrong entrypoint or CMD.
    - Liveness Probe failure: Probe is too aggressive or the endpoint is too slow to respond.

  Steps:
    1. Read logs from the PREVIOUS (crashed) instance — use --previous flag.
    2. Inspect the exit code and lastState to classify the failure.
    3. If OOMKilled: check current memory usage with kubectl top, then increase memory limits.
    4. If app crash: fix the application config, env vars, or startup logic and re-deploy.
commands:
  - "kubectl logs {pod} -n {namespace} --previous --tail=100"
  - "kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState.terminated}'"
  - "kubectl top pod {pod} -n {namespace} --containers"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp'"
windows_commands:
