key: "high-restarts"
title: "High Container Restart Count"
explanation: |
  A container in this pod has restarted many times. 
  This indicates recurring failures such as application panics, continuous Liveness Probe failures, or OOMKilled events.
  Check the previous instance's logs using the `--previous` flag to capture the stack trace or output right before the crash, and check the pod events.
commands:
  - "kubectl logs {pod} -n {namespace} --previous --tail=100"
  - "kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState}'"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp'"
windows_commands:
  - "kubectl logs {pod} -n {namespace} --previous --tail=100"
  - "kubectl get pod {pod} -n {namespace} -o jsonpath='{.status.containerStatuses[*].lastState}'"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp'"
