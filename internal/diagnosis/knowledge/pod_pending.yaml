key: "pod-pending"
title: "Pod Stuck in Pending State"
explanation: |
  The Pod cannot be scheduled to any Node. This is a cluster capacity or constraint issue.
  Common causes:
  1. No node has enough requested CPU or Memory.
  2. The pod has NodeSelectors, Taints/Tolerations, or Affinities that no node matches.
  3. A PersistentVolumeClaim (PVC) requested by the pod cannot be bound or provisioned.
  Check the scheduler's event to see the exact reason why the pod was rejected.
commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp' | grep -i 'FailedScheduling'"
  - "kubectl get pvc -n {namespace}"
  - "kubectl describe pod {pod} -n {namespace} | grep -A 5 -B 5 'Events:'"
windows_commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp' | Select-String -Pattern 'FailedScheduling'"
  - "kubectl get pvc -n {namespace}"
  - "kubectl describe pod {pod} -n {namespace} | Select-String -Pattern 'Events:' -Context 5,5"
