key: "deployment-stuck"
title: "Deployment Rollout Stuck"
explanation: |
  The Deployment rollout is not progressing. The ReplicaSet controller has paused because progressing deadlines were exceeded.
  This happens when the new ReplicaSet cannot scale up its pods (image pull errors, crash loops, node unschedulable, or resource constraints).
  Identify the failing pods created by the new ReplicaSet and investigate their errors. If necessary, trigger a rollback to the previous working state.
commands:
  - "kubectl get replicaset -n {namespace} | grep $(kubectl get deployment {name} -n {namespace} -o jsonpath='{.metadata.name}')"
  - "kubectl rollout status deployment/{name} -n {namespace} --watch=false"
  - "kubectl rollout history deployment/{name} -n {namespace}"
  - "kubectl rollout undo deployment/{name} -n {namespace}"
