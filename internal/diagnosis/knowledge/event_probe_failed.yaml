key: "event-probe-failed"
title: "Health Probe Failure"
explanation: |
  A liveness or readiness probe is repeatedly failing. This causes:

    - Readiness probe failure: Pod is removed from Service endpoints (no traffic).
    - Liveness probe failure: Pod is killed and restarted by kubelet.

  Common causes:
    - The application is slow to start and the probe fires before it's ready.
    - The probe endpoint or port is misconfigured.
    - initialDelaySeconds is too short.
    - The probe timeout is too aggressive for the actual response time.

  Steps:
    1. Read the event message to identify which probe and endpoint failed.
    2. Check the probe configuration (path, port, delays, thresholds).
    3. Verify the application is actually serving on the probed endpoint.
commands:
  - "kubectl describe {kind} {name} -n {namespace}"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name},reason=Unhealthy --sort-by='.lastTimestamp'"
windows_commands:
  - "kubectl describe {kind} {name} -n {namespace}"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name},reason=Unhealthy --sort-by='.lastTimestamp'"
