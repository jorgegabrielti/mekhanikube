key: "imagepullbackoff"
title: "Image Pull Failure"
explanation: |
  Kubernetes cannot pull the container image. The image name or tag may be
  wrong, the registry may be unreachable, or imagePullSecrets are missing
  for a private registry.
commands:
  - "kubectl describe pod {pod} -n {namespace}"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod}"
