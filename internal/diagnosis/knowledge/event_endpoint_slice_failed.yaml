key: "event-endpoint-slice-failed"
title: "EndpointSlice Update Failure"
explanation: |
  The EndpointSlice controller failed to update endpoint information for a Service.
  This can prevent traffic routing to backend pods. Common causes:

    - The Service has too many endpoints and the controller is overwhelmed.
    - RBAC permissions prevent the controller from updating EndpointSlices.
    - API server is under heavy load causing transient failures.

  This is usually a transient issue that resolves itself. If persistent,
  check the kube-controller-manager logs.
commands:
  - "kubectl get endpointslice -n {namespace} -l kubernetes.io/service-name={name}"
  - "kubectl describe service {name} -n {namespace}"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name} --sort-by='.lastTimestamp'"
windows_commands:
  - "kubectl get endpointslice -n {namespace} -l kubernetes.io/service-name={name}"
  - "kubectl describe service {name} -n {namespace}"
