key: "event-image-pull-secret-missing"
title: "ImagePullSecret Not Found"
explanation: |
  The kubelet could not retrieve the imagePullSecret referenced by a ServiceAccount
  or Pod spec. This prevents containers from authenticating to private registries.

  Common causes:
    - The Secret referenced in imagePullSecrets does not exist in the namespace.
    - The Secret was deleted or never created.
    - The Secret name has a typo.

  Steps:
    1. Identify which imagePullSecret is referenced.
    2. Verify the Secret exists in the same namespace as the pod.
    3. If missing, create the docker-registry Secret with valid credentials.
commands:
  - "kubectl get pods -n {namespace} -o jsonpath='{range .items[*]}{.metadata.name}{\"\\t\"}{.spec.imagePullSecrets}{\"\\n\"}{end}'"
  - "kubectl get secrets -n {namespace} -o name | grep -i pull"
  - "kubectl get sa {name} -n {namespace} -o jsonpath='{.imagePullSecrets}'"
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={name} --sort-by='.lastTimestamp'"
windows_commands:
  - "kubectl get pods -n {namespace} -o jsonpath='{range .items[*]}{.metadata.name}{\\\"\\\\t\\\"}{.spec.imagePullSecrets}{\\\"\\\\n\\\"}{end}'"
  - "kubectl get secrets -n {namespace} -o name | Select-String pull"
  - "kubectl get sa {name} -n {namespace} -o jsonpath='{.imagePullSecrets}'"
