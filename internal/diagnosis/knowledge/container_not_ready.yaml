key: "container-not-ready"
title: "Container Not Ready (Probe Failed)"
explanation: |
  The container is running, but the readiness probe has failed continuously. 
  Traffic from Services will not be routed to this pod until it passes. 
  Check if the application is deadlocked, taking too long to initialize, or returning HTTP 5xx on its health endpoint. Review the pod events to see the exact probe failure message.
commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp' | grep -i 'Unhealthy'"
  - "kubectl logs {pod} -n {namespace} --tail=100"
  - "kubectl describe pod {pod} -n {namespace} | grep 'Readiness:'"
windows_commands:
  - "kubectl get events -n {namespace} --field-selector involvedObject.name={pod} --sort-by='.lastTimestamp' | Select-String -Pattern 'Unhealthy'"
  - "kubectl logs {pod} -n {namespace} --tail=100"
  - "kubectl describe pod {pod} -n {namespace} | Select-String -Pattern 'Readiness:'"
