key: replicaset_mismatch
title: ReplicaSet replicas mismatch
explanation: |
  The ReplicaSet has a mismatch between desired and ready replicas. This is the underlying cause for Deployment unavailability and should be investigated by checking the Pods owned by this ReplicaSet.
commands:
  - "kubectl describe rs {name} -n {namespace}"
  - "kubectl get pods -l $(kubectl get rs {name} -n {namespace} -o jsonpath='{.spec.selector.matchLabels}' | jq -r 'to_entries | map(\"\\(.key)=\\(.value)\") | join(\",\")') -n {namespace}"
windows_commands:
  - "kubectl describe rs {name} -n {namespace}"
  - "kubectl get pods -l $((kubectl get rs {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels | Get-Member -MemberType NoteProperty | ForEach-Object { \"$($_.Name)=$((kubectl get rs {name} -n {namespace} -o json | ConvertFrom-Json).spec.selector.matchLabels.$($_.Name))\" } | join ',') -n {namespace}"
