key: cluster-node-skew
title: Node version skew detected
explanation: |
  Nodes in the cluster are running different Kubernetes versions. The Kubernetes version skew
  policy allows kubelets to be up to 3 minor versions behind the API Server, but running mixed
  versions increases the risk of incompatible API behavior and makes troubleshooting harder.

  Common during rolling upgrades, but if the skew persists it may indicate:
    - A stalled node group upgrade
    - Manually managed nodes that were not upgraded
    - Auto-scaling groups using an outdated AMI/image

  Steps:
    1. Identify which nodes are on older versions.
    2. Plan a rolling upgrade for the outdated nodes.
    3. For managed clusters (EKS/GKE/AKS), update the node group configuration.
commands:
  - "kubectl get nodes -o custom-columns=NAME:.metadata.name,VERSION:.status.nodeInfo.kubeletVersion,OS:.status.nodeInfo.osImage"
  - "kubectl get nodes --sort-by=.status.nodeInfo.kubeletVersion"
windows_commands:
  - "kubectl get nodes -o custom-columns=NAME:.metadata.name,VERSION:.status.nodeInfo.kubeletVersion,OS:.status.nodeInfo.osImage"
  - "kubectl get nodes --sort-by=.status.nodeInfo.kubeletVersion"
