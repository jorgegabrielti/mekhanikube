key: rbac_wildcard
title: Role has wildcard permissions
explanation: |
  The Role grants permissions using the '*' wildcard for verbs or resources within the namespace.
  This violates the principle of least privilege and may grant unintended access to sensitive resources
  such as Secrets, ConfigMaps, or workload specs.

  Steps:
    1. Inspect the Role YAML to find which rules use wildcards.
    2. Find all RoleBindings in the namespace that reference this role.
    3. Determine the minimum verbs actually needed by each bound subject (e.g., get, list, watch).
    4. Replace wildcard entries with explicit verbs and resource names.
commands:
  - "kubectl get role {name} -n {namespace} -o yaml"
  - "kubectl get rolebindings -n {namespace} -o wide | grep {name}"
  - "# Fix: kubectl edit role {name} -n {namespace}  -- replace '*' with explicit verbs/resources"
windows_commands:
  - "kubectl get role {name} -n {namespace} -o yaml"
  - "kubectl get rolebindings -n {namespace} -o wide | Select-String '{name}'"
  - "# Fix: kubectl edit role {name} -n {namespace}  -- replace '*' with explicit verbs/resources"
