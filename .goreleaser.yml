version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test -race ./...

builds:
  - id: nautikube
    main: ./cmd/nautikube
    binary: nautikube
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/jorgegabrielti/nautikube/internal/cli.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
  groups:
    - title: "✨ Features"
      regexp: "^feat"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "🔧 Refactoring"
      regexp: "^refactor"
      order: 2
    - title: "📦 Other"
      order: 999

release:
  github:
    owner: jorgegabrielti
    name: nautikube
  prerelease: auto
  name_template: "v{{ .Version }}"
