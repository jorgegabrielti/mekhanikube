linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - goconst
    - gofmt
    - misspell

linters-settings:
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - goconst

run:
  timeout: 10m
  concurrency: 2
  go: "1.24"
